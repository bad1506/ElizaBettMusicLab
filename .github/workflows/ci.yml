name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engineer-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript and Vite build
        run: npm run build
      - name: Preview server smoke test
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/eliza-vite.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /tmp/eliza-home.html; then
              break
            fi
            sleep 1
          done
          test -s /tmp/eliza-home.html
          grep -q '<div id="root"></div>' /tmp/eliza-home.html
          test -f dist/index.html
          echo "Frontend preview smoke test passed"

  backend:
    name: Backend syntax and API contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check --no-input "fastapi>=0.115,<1" "librosa>=0.10,<1" "soundfile>=0.12,<1" "pyloudnorm>=0.1,<1" "numpy>=1.24,<3" "scipy>=1.10,<2" "boto3>=1.35,<2" "httpx>=0.27,<1" -r requirements-test.txt
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Collect backend tests
        run: python -m pytest --collect-only -q tests/
      - name: Run backend tests
        run: python -m pytest tests/ -v
      - name: Validate FastAPI route declarations
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          def declared_routes(path):
              tree = ast.parse(Path(path).read_text(encoding="utf-8"))
              routes = set()
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      for dec in node.decorator_list:
                          if (isinstance(dec, ast.Call)
                              and isinstance(dec.func, ast.Attribute)
                              and dec.func.attr in {"get", "post", "put", "patch", "delete"}
                              and dec.args
                              and isinstance(dec.args[0], ast.Constant)
                              and isinstance(dec.args[0].value, str)):
                              routes.add((dec.func.attr.upper(), dec.args[0].value))
              return routes

          secure = declared_routes("api_secure.py")
          chat = declared_routes("chat_api.py")
          api = declared_routes("api.py")
          mcp = declared_routes("mcp_server.py")

          required_secure = {
              ("POST", "/upload"), ("GET", "/analysis"), ("GET", "/timeline"),
              ("GET", "/intelligence"), ("POST", "/master"), ("POST", "/stems"),
              ("POST", "/reference"), ("GET", "/vocal"), ("POST", "/songwriter"),
              ("POST", "/songwriter/analyze"), ("POST", "/songwriter/direct"),
              ("GET", "/songwriter/memory"), ("POST", "/songwriter/memory"),
              ("POST", "/songwriter/dna/rebuild"), ("GET", "/songwriter/audio-context"),
              ("GET", "/songwriter/melody-map"), ("POST", "/production/run"),
              ("GET", "/production/latest"), ("GET", "/project"),
              ("POST", "/project/save"), ("POST", "/project/export"),
          }
          required_chat = {("POST", "/sona-chat"), ("POST", "/agents/run"), ("GET", "/agents/skills")}
          required_api = {
              ("POST", "/auth/register"), ("POST", "/auth/login"), ("POST", "/auth/logout"),
              ("GET", "/auth/me"), ("GET", "/auth/history"), ("POST", "/auth/history"),
              ("GET", "/billing/plans"), ("GET", "/billing/usage"), ("POST", "/billing/checkout"),
              ("POST", "/billing/yookassa/webhook"), ("POST", "/billing/admin/activate"),
              ("GET", "/agents"), ("GET", "/agents/tools"), ("POST", "/agents/tools/invoke"),
              ("POST", "/agents/invoke"),
          }
          required_mcp = {("POST", "/mcp")}

          checks = {
              "api_secure.py": (secure, required_secure),
              "chat_api.py": (chat, required_chat),
              "api.py": (api, required_api),
              "mcp_server.py": (mcp, required_mcp),
          }
          for filename, (actual, required) in checks.items():
              missing = sorted(required - actual)
              if missing:
                  raise SystemExit(f"Missing API routes in {filename}: {missing}")
          print(f"Validated routes: secure={len(secure)}, chat={len(chat)}, api={len(api)}, mcp={len(mcp)}")
          PY
      - name: Validate billing contract
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          module = ast.parse(Path("billing_yookassa.py").read_text(encoding="utf-8"))
          names = {node.name for node in module.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))}
          required = {"enabled", "prices", "create_checkout", "get_payment", "handle_webhook"}
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Missing billing functions: {missing}")
          import billing_yookassa
          assert billing_yookassa.enabled() is False
          assert billing_yookassa.prices()["creator"] > 0
          print("Billing contract passed")
          PY
