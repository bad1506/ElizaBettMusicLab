name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engineer-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript and Vite build
        run: npm run build
      - name: Preview server smoke test
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/eliza-vite.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /tmp/eliza-home.html; then
              break
            fi
            sleep 1
          done
          test -s /tmp/eliza-home.html
          grep -q '<div id="root"></div>' /tmp/eliza-home.html
          test -f dist/index.html
          echo "Frontend preview smoke test passed"

  backend:
    name: Backend syntax and API contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check --no-input "fastapi>=0.115,<1"
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Run agent runtime tests
        run: python -m unittest discover -s tests/agents -p 'test_*.py' -v
      - name: Validate FastAPI route declarations
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path("api_secure.py").read_text(encoding="utf-8"))
          routes = []
          for node in ast.walk(tree):
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  for dec in node.decorator_list:
                      if isinstance(dec, ast.Call) and isinstance(dec.func, ast.Attribute) and dec.func.attr in {"get", "post", "put", "patch", "delete"} and dec.args:
                          if isinstance(dec.args[0], ast.Constant) and isinstance(dec.args[0].value, str):
                              routes.append((dec.func.attr.upper(), dec.args[0].value, node.name))
          required = {("POST", "/upload"), ("GET", "/analysis"), ("GET", "/timeline"), ("GET", "/intelligence"), ("POST", "/master"), ("POST", "/stems"), ("POST", "/reference"), ("GET", "/vocal"), ("POST", "/songwriter"), ("POST", "/songwriter/analyze"), ("POST", "/songwriter/direct"), ("GET", "/songwriter/memory"), ("POST", "/songwriter/memory"), ("POST", "/songwriter/dna/rebuild"), ("GET", "/songwriter/audio-context"), ("GET", "/songwriter/melody-map"), ("POST", "/production/run"), ("GET", "/production/latest"), ("GET", "/project"), ("POST", "/project/save"), ("POST", "/project/export")}
          actual = {(method, path) for method, path, _ in routes}
          missing = sorted(required - actual)
          if missing:
              raise SystemExit(f"Missing API routes: {missing}")
          print(f"Validated {len(routes)} FastAPI route declarations; public SØNA chat is provided by /sona-chat")
          PY
