services:
  - type: web
    name: eliza-bett-music-lab-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: https://eliza-bett-music-lab.vercel.app
      - key: DEMUCS_DEVICE
        value: cpu
      - key: SONA_DATA_DIR
        value: /var/data/sona
    disk:
      name: sona-data
      mountPath: /var/data
      sizeGB: 10
